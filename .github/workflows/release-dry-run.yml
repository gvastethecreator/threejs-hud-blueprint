name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:full
      - run: pnpm run package:verify
      - run: pnpm run test:consumer
      - run: pnpm run release:dry-run
      - run: pnpm --filter @scope/three-hud publish --dry-run --no-git-checks
      - run: echo "Live npm publish is blocked here. Run validate:release on a release-ready commit first."
