name: Planning integrity

on:
  pull_request:
    paths:
      - "planning/**"
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "ROADMAP.md"
      - "scripts/**"

permissions:
  contents: read

jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/workspace-check.mjs
      - run: node scripts/validate-tickets.mjs
      - run: node scripts/generate-ticket-index.mjs --check
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-doc-links.mjs
