<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three HUD Playground</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #070707;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: 560px;
        padding: 10px 12px;
        color: #e9e9e9;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid #444;
        border-radius: 8px;
        font:
          12px/1.5 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading Three HUD playground…</div>
    <script>
      function showLoadError(message) {
        const status = document.getElementById("status");
        if (status) {
          status.textContent = message;
          status.style.background = "#4a1010";
          status.style.borderColor = "#ff6b6b";
        }
      }
      window.addEventListener("error", (event) => {
        showLoadError(`Load error: ${event.message || event.filename || "unknown"}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        const message = reason instanceof Error ? reason.message : String(reason);
        showLoadError(`Load error: ${message}`);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
