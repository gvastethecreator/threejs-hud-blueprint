<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three HUD Playground</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: auto;
        transform: none;
        max-width: none;
        max-height: 18px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 2px 10px;
        color: #ccc;
        background: #000;
        border: none;
        border-bottom: 1px solid #333;
        letter-spacing: 0.04em;
        border-radius: 0;
        font:
          10px/1.4 ui-monospace,
          monospace;
        pointer-events: none;
        z-index: 2;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading playground…</div>
    <script>
      function showLoadError(message) {
        const status = document.getElementById("status");
        if (status) {
          status.textContent = message;
          status.style.background = "#111";
          status.style.borderColor = "#fff";
          status.style.color = "#fff";
        }
      }
      window.addEventListener("error", (event) => {
        showLoadError(`Unable to load. ${event.message || event.filename || "unknown"}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        const message = reason instanceof Error ? reason.message : String(reason);
        showLoadError(`Unable to load. ${message}`);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
