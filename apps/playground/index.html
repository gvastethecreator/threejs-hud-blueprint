<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three HUD Playground</title>
    <link rel="stylesheet" href="/src/studio.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111111'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23f5f5f5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading playground…</div>
    <script>
      function showLoadError(message) {
        const status = document.getElementById("status");
        if (status) {
          status.textContent = message;
          status.style.background = "#111";
          status.style.borderColor = "#fff";
          status.style.color = "#fff";
        }
      }
      window.addEventListener("error", (event) => {
        showLoadError(`Unable to load. ${event.message || event.filename || "unknown"}`);
      });
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        const message = reason instanceof Error ? reason.message : String(reason);
        showLoadError(`Unable to load. ${message}`);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
